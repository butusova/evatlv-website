<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>האתר נמצא בעדכון | Under Construction</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Helvetica Neue", sans-serif; background: #fff9f6; color: #3b302c; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at top right, rgba(245,158,121,.22), transparent 42%), radial-gradient(circle at bottom left, rgba(224,224,224,.5), transparent 42%), #fff9f6;
    }
    main {
      width: min(100%, 620px); padding: clamp(36px, 8vw, 72px); text-align: center;
      border: 1px solid rgba(245,158,121,.42); border-radius: 28px; background: rgba(255,255,255,.86);
      box-shadow: 0 24px 70px rgba(95,69,58,.12); backdrop-filter: blur(10px);
    }
    .mark { width: 58px; height: 58px; margin: 0 auto 28px; border: 2px solid #f59e79; border-radius: 50%; position: relative; }
    .mark::before, .mark::after { content: ""; position: absolute; inset: 12px 26px; background: #f59e79; border-radius: 999px; }
    .mark::after { transform: rotate(90deg); }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 50px); line-height: 1.15; font-weight: 500; }
    p { margin: 18px 0 0; font-size: clamp(17px, 3.5vw, 21px); line-height: 1.65; color: #74635c; }
    .english { margin-top: 32px; padding-top: 28px; border-top: 1px solid rgba(59,48,44,.12); direction: ltr; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #a47764; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>האתר נמצא בעדכון</h1>
    <p>אנחנו עובדים על משהו חדש.<br>נשוב בקרוב.</p>
    <p class="english">Under construction · We’ll be back soon</p>
  </main>
</body>
</html>
